# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        # cu12 extra: mkdocstrings imports czarr for the API reference
        # (imports work without a GPU; nothing launches kernels).
        - uv run --extra cu12 --group doc zensical build
        - mkdir -p $READTHEDOCS_OUTPUT && mv site $READTHEDOCS_OUTPUT/html
