# Zensical configuration — https://zensical.org/docs/setup/
# Regenerate the fully-annotated template with `zensical new` if needed.

[project]
site_name = "czarr"
site_description = "GPU-native reading and writing of Zarr v3 arrays — nvCOMP codecs, GPUDirect Storage, and an explicit low-level read path."
site_author = "Sricharan Reddy Varra"
site_url = "https://czarr.readthedocs.io/"
repo_url = "https://github.com/srivarra/czarr"
copyright = "Copyright &copy; 2026 Sricharan Reddy Varra"
extra_css = [ "stylesheets/pierre.css" ]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How-to guides" = [
    { "GPU-decode existing CPU stores" = "how-to/read-cpu-stores.md" },
    { "Explicit reads (core + lowlevel)" = "how-to/explicit-reads.md" },
    { "GPUDirect Storage setup" = "how-to/gds.md" },
    { "Benchmarking with czarr-bench" = "how-to/benchmarking.md" },
  ] },
  { "Explanation" = [
    { "The two-tier architecture" = "explanation/architecture.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "API reference" = [
    { "czarr (top level)" = "reference/czarr.md" },
    { "czarr.codecs" = "reference/codecs.md" },
    { "czarr.array" = "reference/array.md" },
    { "czarr.core" = "reference/core.md" },
    { "czarr.lowlevel" = "reference/lowlevel.md" },
    { "czarr.storage & cufile" = "reference/storage.md" },
  ] },
]

[project.theme]
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "content.footnote.tooltips",
  "search.highlight",
]

# Palettes follow the system preference; the toggle overrides per visitor.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Page tags (frontmatter `tags:`); identifiers map tags to icons.
[project.plugins.tags]

[project.extra.tags]
GDS = "gds"
Codecs = "codec"
API = "api"
Performance = "perf"

[project.theme.icon.tag]
default = "lucide/hash"
gds = "lucide/hard-drive"
codec = "lucide/package"
api = "lucide/braces"
perf = "lucide/gauge"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/srivarra/czarr"

# API reference from numpy-style docstrings (preliminary zensical support).
# Requires mkdocstrings[python] (doc dependency group) and an importable
# czarr — i.e. a cu12/cu13 extra installed alongside.
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://zarr.readthedocs.io/en/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
show_symbol_type_heading = true
show_symbol_type_toc = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.snippets]
# resolve --8<-- includes from the repo root, so docs pages can embed
# top-level files like CHANGELOG.md without copies
base_path = ["."]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
