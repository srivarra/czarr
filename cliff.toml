# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Grouping is driven by conventional-commit types parsed from git history.
# The repo URL is hardcoded rather than templated via remote.github:
# referencing the remote context activates git-cliff's GitHub API
# integration, which needs credentials and fails on private repos.

[changelog]
# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {%- for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/srivarra/czarr/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/srivarra/czarr/compare/{{ release.previous.version }}..{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [unreleased]: https://github.com/srivarra/czarr/compare/{{ release.previous.version }}..HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# keep non-conventional commits (grouped under Miscellaneous)
filter_unconventional = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # remove issue numbers from commits
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# regex for parsing and grouping commits by conventional type
commit_parsers = [
  { message = "^[a-z]+(\\(.*\\))?!:", group = "<!-- 0 -->💥 Breaking changes" },
  { body = ".*BREAKING CHANGE.*", group = "<!-- 0 -->💥 Breaking changes" },
  { message = "^chore: update changelog", skip = true },
  { message = "^feat", group = "<!-- 1 -->🚀 Features" },
  { message = "^fix", group = "<!-- 2 -->🐛 Fixes" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 4 -->🔨 Refactor" },
  { message = "^docs", group = "<!-- 5 -->📝 Documentation" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^(build|ci)", group = "<!-- 7 -->🏗️ CI & build" },
  { message = "^(chore|style)", group = "<!-- 8 -->🧰 Maintenance" },
  { message = ".*", group = "<!-- 9 -->🌀 Miscellaneous" },
]
# filter out the commits that are not matched by commit parsers
filter_commits = false
# sort the tags topologically
topo_order = true
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
