[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "czarr"
version = "0.0.1"
description = "Decompress / Compress Zarr on the GPU"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Sricharan Reddy Varra", email = "sricharan.varra@biohub.org" },
]
authors = [ { name = "Sricharan Reddy Varra" } ]
requires-python = ">=3.12"
classifiers = [
  "Operating System :: POSIX :: Linux",

  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # CUDA-version-agnostic core. Pick a CUDA build via the `cu12` or `cu13`
  # extra below — installing czarr without one of them will fail at import.
  "session-info2",
  "zarr>=3.2.1",
]
# CUDA-build extras. The CUDA-version-specific wheels conflict with each
# other, so czarr ships them as mutually-exclusive opt-ins (see
# rapids-single-cell for the pattern). Use:
#   pip install "czarr[cu12]"   # CUDA 12 systems
#   pip install "czarr[cu13]"   # CUDA 13 systems
optional-dependencies.cu12 = [
  "cuda-core>=1.0",
  "cuda-python>=12.9,<13",
  "cupy-cuda12x>=13.6",
  "nvidia-cuda-nvrtc-cu12>=12.9.86",
  "nvidia-cuda-runtime-cu12>=12.9.79",
  "nvidia-nvcomp-cu12>=5.1.0.21",
  "rmm-cu12>=26",
  # Nsight Compute kernel-metrics driver (czarr-bench --ncu). Pulls nvtx +
  # nvidia-ml-py (pynvml) used by the bench telemetry layer. Needs `ncu` on
  # PATH (bundled with the cuda module) only for the --ncu metrics mode.
  "nsight-python[cu12]>=0.9.6",
]
optional-dependencies.cu13 = [
  "cuda-core>=1.0",
  "cuda-python>=13",
  "cupy-cuda13x>=13.6",
  "nvidia-cuda-nvrtc-cu13",
  "nvidia-cuda-runtime-cu13",
  "nvidia-nvcomp-cu13>=5.1.0.21",
  "rmm-cu13>=26",
  "nsight-python[cu13]>=0.9.6",
]
# czarr-bench CLI infra (CUDA-agnostic). Nsight/telemetry deps ride the
# cu12/cu13 extras; this just adds the typer front-end.
optional-dependencies.bench = [
  "typer>=0.12",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://czarr.readthedocs.io/"
urls.Homepage = "https://github.com/srivarra/czarr"
urls.Source = "https://github.com/srivarra/czarr"

# Auto-discoverable native codecs — zarr loads these lazily when it
# encounters their codec_id in array metadata.  Compat codecs (zstd /
# lz4 / gzip / zlib) are NOT registered here on purpose: they shadow
# stdlib codecs and must be explicitly opted-in via configure_gpu().
[project.entry-points."zarr.codecs"]
"czarr.ans"      = "czarr.codecs.compressors.native:ANS"
"czarr.bitcomp"  = "czarr.codecs.compressors.native:Bitcomp"
"czarr.cascaded" = "czarr.codecs.compressors.native:Cascaded"
"czarr.deflate"  = "czarr.codecs.compressors.native:Deflate"
"czarr.gdeflate" = "czarr.codecs.compressors.native:GDeflate"
"czarr.snappy"   = "czarr.codecs.compressors.native:Snappy"

[project.entry-points."zarr.codec_pipeline"]
"czarr.pipeline" = "czarr.pipeline.pipeline:CzarrPipeline"

# Unified benchmark CLI. Needs the `bench` extra (typer) installed; the
# Nsight/telemetry deps ride along with the cu12/cu13 extra.
[project.scripts]
czarr-bench = "czarr.bench.cli:app"


[dependency-groups]
dev = [
  "pre-commit",
  "twine>=4.0.2",
  "ty>=0.0.12",
  { include-group = "nb" },
]
test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
nb = [ "jupyterlab>=4.5.2" ]

doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]

[tool.hatch.envs.default]
installer = "uv"
dependency-groups = [ "dev" ]

[tool.hatch.envs.docs]
dependency-groups = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with normal deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.12", "3.14" ]

# Test the newest supported Python version also with pre-release deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.14" ]

[tool.hatch.envs.hatch-test]
dependency-groups = [ "dev", "test" ]

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [
    "pre",
  ] },
]

[tool.uv]
conflicts = [
  [
    { extra = "cu12" },
    { extra = "cu13" },
  ],
]
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
rmm-cu12 = { index = "nvidia" }
librmm-cu12 = { index = "nvidia" }
rmm-cu13 = { index = "nvidia" }
librmm-cu13 = { index = "nvidia" }

# Mark cu12/cu13 as mutually-exclusive so uv can resolve each extra
# independently (otherwise uv tries to satisfy both at once and fails).

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
# Research spikes and bench scratchpads live under .planning/ — held
# to a lighter lint standard than production code under src/.
extend-exclude = [ ".planning" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."bench/*" = [ "BLE001", "C408", "D", "E402", "E702", "F841" ]
# The bench harness degrades gracefully when optional tooling (NVML, RMM stats,
# Nsight, ncu) is missing — broad excepts there are deliberate, not sloppy.
lint.per-file-ignores."src/czarr/bench/**" = [ "BLE001" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
strict = true
testpaths = [ "tests" ]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "czarr" ]
patch = [ "subprocess" ]
omit = [ "**/test_*.py" ]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]

# RMM wheels are published on NVIDIA's index, not the public PyPI mirror.
